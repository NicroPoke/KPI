<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DecisionDex</title>
    <script src="../core/dataContract.js"></script>
    <script src="../core/generator.js"></script>
    <script src="../core/memoization.js"></script>
    <script src="../core/priorityQueue.js"></script>
    <script src="../core/asyncUtils.js"></script>
    <script src="../core/streamProcessor.js"></script>
    <script src="../core/events.js"></script>
    <script src="../core/authProxy.js"></script>
    <script src="../core/logger.js"></script>
    <script src="../core/scoringEngine.js"></script>
    <script src="../core/index.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <h1>DecisionDex</h1>
        <p id="status" class="status"></p>
      </header>

      <section class="team-section">
        <h2>Your Team</h2>
        <div id="myTeam" class="team-grid"></div>
      </section>

      <section class="team-section">
        <h2>Enemy Team</h2>
        <div id="enemyTeam" class="team-grid"></div>
      </section>

      <section class="team-section">
        <h2>Recommended Lead</h2>
        <article id="leadCard" class="lead-card">
          <h3 id="leadName">-</h3>
          <p id="leadScore" class="lead-score"></p>
          <ul id="leadReasons" class="lead-reasons"></ul>
        </article>
      </section>

      <section class="team-section">
        <h2>Lead Ranking</h2>
        <div id="rankingList" class="ranking-list"></div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
